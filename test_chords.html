<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="static/chordpro.css">
    <style>
        body { font-family: monospace; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        .debug h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Chord Parser Debug Test</h1>
    <div id="output"></div>
    <div id="debug"></div>
    
    <script src="static/chord-parser.js"></script>
    <script>
        const testInput = `[D]uem é como [Bm]Tu, [A]Jesus
[G]Não há [D]ninguém além de Ti`;
        
        const result = window.parseChordPro2(testInput, 0, 0);
        
        document.getElementById('output').innerHTML = result;
        
        // Show raw HTML with formatting
        const debugDiv = document.getElementById('debug');
        debugDiv.innerHTML = '<h3>Generated HTML (formatted):</h3><pre>' + 
            result.replace(/></g, '>\n<').replace(/</g, '\n<') + 
            '</pre>';
    </script>
</body>
</html>
