{% extends "layout.html" %}

{% block content %}
  <div class="min-h-screen flex items-center justify-center bg-gray-900 p-4 sm:p-6 md:p-8">
    <div class="w-full max-w-md bg-gray-900 rounded-lg shadow-lg p-6 sm:p-8 border border-gray-700">
      <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Nova Password</h1>
        <p class="text-gray-400 text-sm">Escolha uma nova password para a sua conta.</p>
      </div>

      <form hx-post="/api/users/reset-password" hx-target="#reset-messages" hx-swap="innerHTML" class="space-y-5">
        <input type="hidden" name="token" value="{{ token }}" />
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Nova password</label>
          <input id="password" name="password" type="password" minlength="6" required class="w-full px-4 py-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
        </div>
        <div>
          <label for="password_confirmation" class="block text-sm font-medium text-gray-300 mb-2">Confirmar nova password</label>
          <input id="password_confirmation" name="password_confirmation" type="password" minlength="6" required class="w-full px-4 py-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
        </div>
        <div id="reset-messages" class="min-h-[1.25rem]"></div>
        <button type="submit" class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-700 to-yellow-400 text-white font-semibold hover:opacity-80 transition">Alterar password</button>
      </form>
    </div>
  </div>
{% endblock %}
