{% extends "layout.html" %}

{% block content %}
  <div class="min-h-screen flex items-center justify-center bg-gray-900 p-4 sm:p-6 md:p-8">
    <div class="w-full max-w-md">
      <div class="bg-gray-900 rounded-lg shadow-lg p-6 sm:p-8 border border-gray-700">
        <div class="mb-6 sm:mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2 sm:mb-3">Esqueci a Password</h1>
          <p class="text-gray-400 text-sm sm:text-base leading-relaxed">
            Insira seu email e enviaremos um link para resetar sua password
          </p>
        </div>

        <form hx-post="/api/users/forgot-password" hx-target="#forgot-messages" hx-swap="innerHTML" hx-indicator="#forgot-spinner" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="seu@email.com"
              class="w-full px-4 py-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400"
              required
            />
          </div>

          <div id="forgot-messages" class="min-h-[1.25rem]"></div>

          <button
            type="submit"
            class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-700 to-yellow-400 text-white font-semibold hover:opacity-80 transition"
          >
            Enviar Link
          </button>

          <div class="text-center">
            <span id="forgot-spinner" class="htmx-indicator text-xs text-gray-400">Processando...</span>
          </div>

          <div class="space-y-3 text-sm">
            <a href="/" class="block text-center text-gray-400 hover:text-gray-300 transition">
              Lembrou da senha? Voltar ao login
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
