<div x-data="{
  cifraOriginal: '',
  chordPro: '',
  preview: '',
  viewMode: 'preview',
  convertTimer: null,
  keyMessage: '',
  tapTimes: [],
  tapMessage: '',
  youtubePlaying: false,
  youtubeEmbedUrl: '',
  youtubeWatchUrl: '',
  youtubeVersions: [],
  youtubeVersionIndex: 0,
  youtubeMessage: '',
  tapBpm() {
    const now = performance.now();
    const last = this.tapTimes[this.tapTimes.length - 1];
    // Ignora cliques duplicados e reinicia após uma pausa.
    if (last !== undefined && now - last < 150) return;
    if (last !== undefined && now - last > 4000) this.tapTimes = [];
    this.tapTimes.push(now);
    this.tapTimes = this.tapTimes.slice(-8);
    if (this.tapTimes.length < 2) {
      this.tapMessage = 'Continue a tocar no ritmo da música.';
      return;
    }
    const interval = (now - this.tapTimes[0]) / (this.tapTimes.length - 1);
    const bpm = Math.round(60000 / interval);
    this.$refs.orgTempo.value = bpm;
    this.tapMessage = 'Tempo estimado: ' + bpm + ' BPM. Pode corrigir manualmente antes de guardar.';
  },
  toggleYoutubePlayback() {
    if (this.youtubePlaying) {
      // Remove o leitor do DOM (template x-if), o que interrompe o áudio.
      this.youtubePlaying = false;
      this.youtubeEmbedUrl = '';
      this.youtubeWatchUrl = '';
      this.youtubeMessage = 'Reprodução parada.';
      return;
    }
    const api = window.praiseChordsYoutube;
    const field = this.$refs.youtubeLinks;
    const videos = api && field ? api.videos(field.value) : [];
    if (!videos.length) {
      this.youtubeVersions = [];
      this.youtubeMessage = 'Sem link de vídeo do YouTube válido no campo. Adicione um link para poder tocar.';
      return;
    }
    this.youtubeVersions = videos;
    if (this.youtubeVersionIndex >= videos.length) this.youtubeVersionIndex = 0;
    this.startYoutubeVersion(this.youtubeVersionIndex);
  },
  startYoutubeVersion(index) {
    const api = window.praiseChordsYoutube;
    const video = this.youtubeVersions[index];
    if (!api || !video) return;
    this.youtubeVersionIndex = index;
    this.youtubeEmbedUrl = api.embedUrl(video.videoId);
    this.youtubeWatchUrl = api.watchUrl(video.videoId);
    this.youtubePlaying = true;
    this.youtubeMessage = 'A tocar: ' + (index === 0 ? 'Original (principal)' : 'Versão alternativa ' + index) + '.';
  },
  changeYoutubeVersion() {
    if (!this.youtubePlaying) return;
    this.startYoutubeVersion(this.youtubeVersionIndex);
  },
  detectKey() {
    if (!window.DetectKey) {
      this.keyMessage = 'Não foi possível carregar a deteção de tom. Recarregue a página.';
      return;
    }
    if (this.convertTimer !== null) {
      clearTimeout(this.convertTimer);
      this.convertTimer = null;
      this.chordPro = window.cifraToChordPro ? window.cifraToChordPro(this.cifraOriginal) : this.cifraOriginal;
      this.renderPreview();
    }
    const key = window.DetectKey(this.chordPro);
    if (key === 'N/A') {
      this.keyMessage = 'Não foi possível detetar o tom. Insira uma cifra com acordes.';
      return;
    }
    this.$refs.orgKey.value = key;
    this.keyMessage = 'Tom provável: ' + key + '. Pode corrigir manualmente antes de guardar.';
  },
  convert() {
    clearTimeout(this.convertTimer);
    this.convertTimer = setTimeout(() => {
      this.convertTimer = null;
      if (window.cifraToChordPro) {
        this.chordPro = window.cifraToChordPro(this.cifraOriginal);
      } else {
        this.chordPro = this.cifraOriginal;
      }
      this.renderPreview();
    }, 300);
  },
  renderPreview() {
    // Sem conversão forçada de acidentes: a pré-visualização mostra exatamente
    // a grafia guardada no ChordPro (o botão # ⇄ b altera o texto guardado).
    this.preview = window.parseChordPro2 ? window.parseChordPro2(this.chordPro, 0, 0) : '';
  },
  toggleView() { this.viewMode = this.viewMode === 'preview' ? 'chordpro' : 'preview'; },
  alignChords() {
    if (!window.alignChordsToSyllables) return;
    this.chordPro = window.alignChordsToSyllables(this.chordPro);
    this.renderPreview();
  },
  transposeChords(steps) {
    if (!window.transposeChordPro) return;
    this.chordPro = window.transposeChordPro(this.chordPro, steps);
    this.renderPreview();
  },
  toggleAccidentals() {
    if (!window.applyAccidentalsChordPro) return;
    // Converte apenas o que está dentro dos acordes [X], não a letra.
    const chords = (this.chordPro.match(/\[[^\][\r\n]*\]/g) || []).join(' ');
    const flats = (chords.match(/[A-G]b/g) || []).length;
    const sharps = (chords.match(/[A-G]#/g) || []).length;
    this.chordPro = window.applyAccidentalsChordPro(this.chordPro, flats > sharps ? 1 : -1);
    this.renderPreview();
  },
  insertTag(type) {
    const ta = this.$refs.chordPro;
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selectedText = this.chordPro.substring(start, end);
    const before = this.chordPro.substring(0, start);
    const after = this.chordPro.substring(end);
    let tag = '';
    let cursorOffset = 0;
    switch (type) {
      case 'soc':
        if (selectedText.trim()) {
          tag = `{soc: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{soc: }';
          cursorOffset = -1;
        }
        break;
      case 'eoc':
        tag = '{eoc}';
        break;
      case 'sop':
        if (selectedText.trim()) {
          tag = `{sop: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{sop: }';
          cursorOffset = -1;
        }
        break;
      case 'eop':
        tag = '{eop}';
        break;
      case 'inline':
        if (selectedText.trim()) {
          tag = `{inline: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{inline: }';
          cursorOffset = -1;
        }
        break;
      case 't':
        if (selectedText.trim()) {
          tag = `{t: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{t: }';
          cursorOffset = -1;
        }
        break;
      case 'st':
        if (selectedText.trim()) {
          tag = `{st: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{st: }';
          cursorOffset = -1;
        }
        break;
      case 'c':
        if (selectedText.trim()) {
          tag = `{c: ${selectedText}}`;
          cursorOffset = 0;
        } else {
          tag = '{c: }';
          cursorOffset = -1;
        }
        break;
      default:
        return;
    }
    this.chordPro = before + tag + after;
    this.$nextTick(() => {
      const newPos = start + tag.length + cursorOffset;
      ta.setSelectionRange(newPos, newPos);
      ta.focus();
      this.renderPreview();
    });
  },
  init() {
    if (!window.cifraToChordPro) {
      var s1 = document.createElement('script');
      s1.src = '/static/chordsheetjs.min.js';
      s1.onload = function() {
        if (typeof ChordSheetJS !== 'undefined' && !window.ChordSheetJS) window.ChordSheetJS = ChordSheetJS;
        var s2 = document.createElement('script');
        s2.src = '/static/cifra2chordpro.js';
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    }
    if (!window.alignChordsToSyllables) {
      var s3 = document.createElement('script');
      s3.src = '/static/syllable-align.js';
      document.head.appendChild(s3);
    }
  }
}" x-init="chordPro = $refs.chordPro.value; renderPreview()" class="p-6 text-white">
  <div class="mb-6 flex items-start justify-between gap-4"><div><h2 class="text-2xl font-bold">Editar Música</h2><p class="mt-1 text-sm text-gray-400">{{ song.title }}</p></div><button type="button" data-modal-close class="rounded bg-gray-700 px-4 py-2 hover:bg-gray-600">Cancelar</button></div>
  <form hx-post="/htmx/songs/{{ song.id }}/edit" hx-target="#song-edit-message" hx-swap="innerHTML" class="space-y-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><label class="block text-sm font-medium text-gray-300">Nome da Música<input name="name" value="{{ song.name }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" placeholder="Nome da música" /></label><label class="block text-sm font-medium text-gray-300">Nome Original<input name="org_name" value="{{ song.org_name }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" placeholder="Nome original" /></label></div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><label class="block text-sm font-medium text-gray-300">Compositor<input name="composer" value="{{ song.composer }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" /></label><label class="block text-sm font-medium text-gray-300">Artistas<input name="artistas" value="{{ song.artistas }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" /></label></div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><label class="block text-sm font-medium text-gray-300">Código<input id="code-field" name="code" type="text" value="{{ song.code }}" readonly class="mt-2 w-full rounded border border-gray-600 bg-gray-700 px-4 py-2 text-gray-300 cursor-not-allowed" placeholder="Selecione um género para gerar código automático" /><span class="text-xs text-gray-500">Gerado automaticamente com base no género</span></label><label class="block text-sm font-medium text-gray-300">Género<select id="genre-type-select" name="genre_type" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black"><option value="">Selecionar género</option>{% for genre in genres %}<option value="{{ genre.id }}"{% if genre.selected %} selected{% endif %}>{{ genre.name }}</option>{% endfor %}</select></label></div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><div><label class="block text-sm font-medium text-gray-300">Tom Original<input x-ref="orgKey" name="org_key" value="{{ song.org_key }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" placeholder="Ex: C, D, Em" /></label><button type="button" @click="detectKey()" class="mt-2 rounded bg-blue-600 px-3 py-1 text-sm font-semibold text-white hover:bg-blue-700" title="Estimar o tom a partir dos acordes da cifra">Detetar tom</button><p role="status" aria-live="polite" class="mt-1 text-xs text-gray-400" x-text="keyMessage"></p></div><div><label class="block text-sm font-medium text-gray-300">Tempo<input x-ref="orgTempo" name="org_tempo" type="number" value="{{ song.org_tempo }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" placeholder="BPM" /></label><button type="button" @click="tapBpm()" class="mt-2 rounded bg-blue-600 px-3 py-1 text-sm font-semibold text-white hover:bg-blue-700" title="Toque ao ritmo da música para calcular o BPM">Tap BPM</button><p class="mt-1 text-xs text-gray-400">Toque várias vezes ao ritmo. Após 4 segundos de pausa, a medição recomeça.</p><p role="status" aria-live="polite" class="mt-1 text-xs text-gray-400" x-text="tapMessage"></p></div></div>
  <script>
    (function() {
      var genrePrefixes = {};
      {% for genre in genres %}genrePrefixes['{{ genre.id }}'] = '{{ genre.prefix }}';{% endfor %}
      var isEdit = {% if song.id != 0 %}true{% else %}false{% endif %};
      function generateCode(genreId, callback) {
        if (!genreId) return;
        var prefix = genrePrefixes[genreId];
        if (!prefix) return;
        fetch('/htmx/songs/next-code?prefix=' + encodeURIComponent(prefix))
          .then(function(r) { return r.json(); })
          .then(function(data) { if (data.code) callback(data.code); })
          .catch(function() {});
      }
      var codeField = document.getElementById('code-field');
      var genreSelect = document.getElementById('genre-type-select');
      if (codeField && genreSelect && !isEdit) {
        genreSelect.addEventListener('change', function() {
          if (this.value) generateCode(this.value, function(code) { codeField.value = code; });
          else codeField.value = '';
        });
        if (genreSelect.value) generateCode(genreSelect.value, function(code) { codeField.value = code; });
      }
    })();
  </script>
    <div><label class="block text-sm font-medium text-gray-300">Links do YouTube<textarea x-ref="youtubeLinks" name="youtube" rows="3" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" placeholder="Um ID ou link do YouTube por linha">{{ song.youtube }}</textarea><span class="mt-1 block text-xs text-gray-400">Um link por linha. O primeiro é a versão original; os seguintes são versões alternativas (por exemplo, noutras línguas).</span></label><div class="mt-2 flex flex-wrap items-center gap-2"><button type="button" @click="toggleYoutubePlayback()" :class="youtubePlaying ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'" class="rounded px-3 py-1 text-sm font-semibold text-white" title="Ouvir a música enquanto edita a cifra" x-text="youtubePlaying ? '■ Parar' : '▶ Tocar'"></button><select x-show="youtubeVersions.length > 1" x-model.number="youtubeVersionIndex" @change="changeYoutubeVersion()" class="rounded border border-gray-600 bg-white px-2 py-1 text-sm text-black" title="Escolher a versão a ouvir"><template x-for="(version, index) in youtubeVersions" :key="index"><option :value="index" x-text="index === 0 ? 'Original (principal)' : 'Versão alternativa ' + index"></option></template></select></div><template x-if="youtubePlaying"><div class="mt-2"><iframe :src="youtubeEmbedUrl" class="w-full rounded border border-gray-600" height="200" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><a :href="youtubeWatchUrl" target="_blank" rel="noopener noreferrer" class="mt-1 inline-block text-xs text-blue-400 hover:text-blue-300">Abrir no YouTube</a></div></template><p role="status" aria-live="polite" class="mt-1 text-xs text-gray-400" x-text="youtubeMessage"></p></div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><label class="block text-sm font-medium text-gray-300">Copyright<input name="copyright" value="{{ song.copyright }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" /></label><label class="block text-sm font-medium text-gray-300">Temas<input name="themes" value="{{ song.themes }}" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 text-black" /></label></div>
    <label class="block text-sm font-medium text-gray-300">Cifra Original<textarea x-model="cifraOriginal" @input="convert()" rows="10" style="text-align: left;" class="mt-2 w-full rounded border border-gray-600 bg-white px-4 py-2 font-mono text-sm text-black text-left" placeholder="Cole aqui a cifra original (ex.: formato CifraClub) para converter para ChordPro..."></textarea><span class="mt-1 block text-xs text-gray-400">Ao colar, a cifra é convertida automaticamente para o formato ChordPro (que fica editável e é o que será gravado).</span></label>
    <section class="rounded-lg border border-gray-600 bg-white p-1">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-gray-200 px-3 py-2"><span class="text-sm font-medium text-gray-700">Cifra em ChordPro</span><button type="button" @click="toggleView()" class="rounded bg-blue-600 px-3 py-1 text-sm font-semibold text-white hover:bg-blue-700" x-text="viewMode === 'preview' ? 'Ver ChordPro' : 'Ver Pré-visualização'"></button></div>
      <div x-show="viewMode === 'chordpro'" class="p-2">
        <div class="mb-2 flex flex-wrap items-center gap-1">
          <span class="text-xs font-medium text-gray-500 mr-1">Atalhos:</span>
          <button type="button" @click="insertTag('soc')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Start of Chorus">{soc : }</button>
          <button type="button" @click="insertTag('eoc')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="End of Chorus">{eoc}</button>
          <button type="button" @click="insertTag('sop')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Start of Paragraph">{sop: }</button>
          <button type="button" @click="insertTag('eop')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="End of Paragraph">{eop}</button>
          <button type="button" @click="insertTag('inline')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Texto inline/anotação">{inline: }</button>
          <button type="button" @click="insertTag('t')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Título/Translation">{t: }</button>
          <button type="button" @click="insertTag('st')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Subtítulo">{st: }</button>
          <button type="button" @click="insertTag('c')" class="rounded bg-gray-200 px-2 py-1 text-xs font-mono text-gray-700 hover:bg-gray-300" title="Comentário">{c: }</button>
          <button type="button" @click="alignChords()" class="rounded bg-emerald-200 px-2 py-1 text-xs font-semibold text-emerald-800 hover:bg-emerald-300" title="Realinhar acordes para o início das sílabas">🎵 Alinhar Acordes</button>
          <button type="button" @click="transposeChords(1)" class="rounded bg-blue-500 px-2 py-1 text-xs font-semibold text-white hover:bg-blue-700" title="Subir todos os acordes meio tom">▲ +1</button>
          <button type="button" @click="transposeChords(-1)" class="rounded bg-blue-500 px-2 py-1 text-xs font-semibold text-white hover:bg-blue-700" title="Baixar todos os acordes meio tom">▼ −1</button>
          <button type="button" @click="toggleAccidentals()" class="rounded bg-blue-500 px-2 py-1 text-xs font-semibold text-white hover:bg-blue-700" title="Alternar a grafia dos acordes entre sustenidos (#) e bemóis (b)"># ⇄ b</button>
        </div>
        <textarea x-ref="chordPro" x-model="chordPro" @input="renderPreview()" name="chord_pro" rows="12" style="text-align: left;" class="w-full rounded border border-gray-300 bg-white px-4 py-2 font-mono text-sm text-black text-left" placeholder="[Acorde]letra ...">{{ song.chord_pro }}</textarea>
        <p class="mt-1 px-1 text-xs text-gray-500">Pce corrigir aqui qualquer pormenor do ChordPro convertido.</p>
      </div>
      <div x-show="viewMode === 'preview'" class="p-2"><div class="chord-container max-h-96 overflow-auto bg-white" x-html="preview"></div></div>
    </section>
    <textarea name="lyrics" class="hidden">{{ song.lyrics }}</textarea>
    <div id="song-edit-message" class="text-sm"></div><div class="flex gap-3"><button type="submit" class="flex-1 rounded bg-blue-600 px-6 py-3 font-semibold hover:bg-blue-700">Guardar Alterações</button><button type="button" data-modal-close class="flex-1 rounded bg-gray-700 px-6 py-3 font-semibold hover:bg-gray-600">Cancelar</button></div>
  </form>
</div>
