{% extends "layout.html" %}

{% block content %}
  <header class="bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800 shadow-lg border-b border-gray-700">
    <div class="container mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="/static/logo2.png" alt="PraiseChords Logo" class="w-16 h-16 rounded-lg shadow-lg" />
          <div>
            <h1 class="text-3xl font-bold text-white">PraiseChords</h1>
            <p class="text-sm text-gray-300">Gestão de Utilizadores</p>
          </div>
        </div>
        <a href="/app" class="bg-gray-600 hover:bg-gray-700 text-white text-sm py-1 px-3 rounded transition-colors">Voltar</a>
      </div>
    </div>
  </header>

  <main class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <div class="container mx-auto px-4 py-12 max-w-7xl">
      <section class="relative overflow-hidden bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 rounded-2xl shadow-2xl p-5 text-white mb-12">
        <div class="absolute inset-0 opacity-10">
          <div class="absolute top-0 left-0 w-32 h-32 bg-white rounded-full -translate-x-16 -translate-y-16"></div>
          <div class="absolute bottom-0 right-1/3 w-16 h-16 bg-white rounded-full translate-y-8"></div>
        </div>
        <div class="relative">
          <div class="flex items-center justify-center lg:justify-start gap-3 mb-3">
            <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center border-4 border-white/30">
              <span class="text-xl font-bold">👥</span>
            </div>
            <div>
              <h2 class="text-2xl lg:text-3xl font-bold mb-1">Gerir Utilizadores</h2>
              <p class="text-indigo-100 text-sm">Criar, editar e manter utilizadores e suas passwords</p>
            </div>
          </div>
        </div>
      </section>

      <section class="mb-12">
        <div class="bg-gray-800/50 rounded-xl p-6 border border-gray-700/50">
          <h3 class="text-xl font-bold text-white mb-4">➕ Criar Novo Utilizador</h3>
          <form id="create-user-form" hx-post="/htmx/users/create" hx-target="#user-form-message" hx-swap="innerHTML" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Nome *</label>
                <input type="text" name="nome" required class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nome completo" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email *</label>
                <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="email@exemplo.com" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password *</label>
                <input type="password" name="password" required minlength="6" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Mínimo 6 caracteres" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Igreja</label>
                <input type="text" name="igreja" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nome da igreja (opcional)" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Perfil *</label>
                <select name="perfil" required class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="1">Utilizador</option>
                  <option value="2">Moderador</option>
                  <option value="3">Administrador</option>
                  <option value="4">Programador</option>
                </select>
              </div>
              <div class="flex items-center">
                <input type="checkbox" name="ativo" id="ativo" value="true" checked class="w-4 h-4 text-indigo-600 bg-gray-700 border-gray-600 rounded focus:ring-2 focus:ring-indigo-500" />
                <label for="ativo" class="ml-2 text-sm text-gray-300">Conta ativa</label>
              </div>
            </div>
            <div class="flex gap-3">
              <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Criar Utilizador</button>
              <button type="reset" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Limpar</button>
            </div>
          </form>
          <div id="user-form-message" class="mt-4"></div>
        </div>
      </section>


      <section>
        <div class="bg-gray-800/50 rounded-xl p-6 border border-gray-700/50">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-bold text-white">📋 Utilizadores Registados</h3>
            <button hx-get="/htmx/users/list" hx-target="#users-list-container" hx-swap="innerHTML" class="bg-blue-600 hover:bg-blue-700 text-white text-sm py-2 px-4 rounded-lg transition-colors">
              🔄 Actualizar
            </button>
          </div>
          <div id="users-list-container">
            <div class="text-center text-gray-400 py-8">
              <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
              <p class="mt-2">A carregar utilizadores...</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Load users list on page load
    document.addEventListener('DOMContentLoaded', function() {
      htmx.ajax('GET', '/htmx/users/list', {
        target: '#users-list-container',
        swap: 'innerHTML'
      });
    });

    document.body.addEventListener('usersChanged', function() {
      document.getElementById('create-user-form').reset();
      htmx.ajax('GET', '/htmx/users/list', {
        target: '#users-list-container',
        swap: 'innerHTML'
      });
    });
  </script>
{% endblock %}
