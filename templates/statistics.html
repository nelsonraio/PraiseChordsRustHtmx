{% extends "layout.html" %}

{% block content %}
  <header class="bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800 shadow-lg border-b border-gray-700">
    <div class="container mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="/static/logo2.png" alt="PraiseChords Logo" class="w-16 h-16 rounded-lg shadow-lg" />
          <div>
            <h1 class="text-3xl font-bold text-white">PraiseChords</h1>
            <p class="text-sm text-gray-300">Estatísticas da Plataforma</p>
          </div>
        </div>
        <a href="/app" class="bg-gray-600 hover:bg-gray-700 text-white text-sm py-1 px-3 rounded transition-colors">Voltar</a>
      </div>
    </div>
  </header>

  <main class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <div class="container mx-auto px-4 py-12 max-w-7xl">
      <section class="relative overflow-hidden bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-700 rounded-2xl shadow-2xl p-5 text-white mb-12">
        <div class="absolute inset-0 opacity-10">
          <div class="absolute top-0 left-0 w-32 h-32 bg-white rounded-full -translate-x-16 -translate-y-16"></div>
          <div class="absolute bottom-0 right-1/3 w-16 h-16 bg-white rounded-full translate-y-8"></div>
        </div>
        <div class="relative">
          <div class="flex items-center justify-center lg:justify-start gap-3 mb-3">
            <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center border-4 border-white/30">
              <span class="text-xl font-bold">📊</span>
            </div>
            <div>
              <h2 class="text-2xl lg:text-3xl font-bold mb-1">Estatísticas de Utilização</h2>
              <p class="text-blue-100 text-sm">Monitorize quantos utilizadores diferentes estão a usar a plataforma</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Period selector -->
      <section class="mb-8">
        <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50">
          <div class="flex flex-wrap items-center gap-3">
            <span class="text-sm text-gray-400">Período:</span>
            <a href="/statistics?days=7" class="px-3 py-1.5 rounded-lg text-sm {% if days == 7 %}bg-blue-500/20 border-blue-400 text-white{% else %}bg-white/5 border-white/10 text-gray-300{% endif %} border">7 dias</a>
            <a href="/statistics?days=30" class="px-3 py-1.5 rounded-lg text-sm {% if days == 30 %}bg-blue-500/20 border-blue-400 text-white{% else %}bg-white/5 border-white/10 text-gray-300{% endif %} border">30 dias</a>
            <a href="/statistics?days=90" class="px-3 py-1.5 rounded-lg text-sm {% if days == 90 %}bg-blue-500/20 border-blue-400 text-white{% else %}bg-white/5 border-white/10 text-gray-300{% endif %} border">90 dias</a>
            <a href="/statistics?days=365" class="px-3 py-1.5 rounded-lg text-sm {% if days == 365 %}bg-blue-500/20 border-blue-400 text-white{% else %}bg-white/5 border-white/10 text-gray-300{% endif %} border">1 ano</a>
          </div>
        </div>
      </section>

      <!-- STATS_CONTENT -->

    </div>
  </main>
{% endblock %}
