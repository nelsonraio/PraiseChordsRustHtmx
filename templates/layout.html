<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PraiseChords">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/css/fontawesome.min.css">
  <style>
    [x-cloak] { display: none !important; }
    .filter-collapse {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 300ms ease, opacity 250ms ease;
    }
    .filter-collapse-open {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .filter-collapse > div {
      min-height: 0;
      overflow: hidden;
    }
    .quick-action-card {
      transition: transform 200ms ease, filter 200ms ease, box-shadow 200ms ease;
    }
    .quick-action-card:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.05);
      box-shadow: 0 8px 16px rgb(0 0 0 / 0.25);
    }
  </style>
  <title>PraiseChords</title>
</head>
<body class="bg-gray-950 text-white min-h-screen m-0">
  {% block page %}
    {% block content %}{% endblock %}
  {% endblock %}
  <script src="/static/htmx.min.js?v=2.0.10"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('favButton', (id, initial) => ({
        fav: initial === true || initial === 'true',
        async toggle() {
          const prev = this.fav;
          this.fav = !this.fav; // optimistic
          try {
            const res = await fetch(`/api/songs/${id}/favorite`, { method: 'POST' });
            const json = await res.json();
            this.fav = json.favorite;
            // Se desmarcou uma favorita estando no modo "Favoritos" da pesquisa,
            // recarrega a lista para a música desaparecer dos resultados.
            if (prev && !json.favorite) {
              const form = document.getElementById('search-controls');
              let favMode = false;
              try { favMode = !!(window.Alpine && form && String(window.Alpine.$data(form).fav) === '1'); } catch (_) {}
              if (favMode && window.htmx) {
                setTimeout(() => window.htmx.trigger(form, 'submit'), 200);
              }
            }
          } catch (e) {
            this.fav = prev;
          }
        }
      }));
      Alpine.data('searchBox', () => ({
        history: [],
        key: 'pc_search_history',
        init() { this.load(); },
        load() {
          try {
            const raw = localStorage.getItem(this.key);
            this.history = raw ? JSON.parse(raw) : [];
          } catch (e) { this.history = []; }
        },
        save() {
          localStorage.setItem(this.key, JSON.stringify(this.history.slice(0,10)));
        },
        add(q) {
          q = (q||'').trim();
          if (!q) return;
          this.history = this.history.filter(x => x !== q);
          this.history.unshift(q);
          this.history = this.history.slice(0,10);
          this.save();
        },
        clear() {
          this.history = [];
          localStorage.removeItem(this.key);
        },
        set(q) {
          this.add(q);
          const el = this.$root.querySelector('#search-input');
          if (el) {
            el.value = q;
            this.$nextTick(() => {
              el.dispatchEvent(new Event('input', { bubbles: true }));
              el.dispatchEvent(new KeyboardEvent('keyup'));
            });
          }
        }
      }));
      Alpine.data('chordViewer', (songId, initialFavorite, initialFontSize = 16, initialColumnCount = 0, initialAccidentals = 0, initialTranspose = 0, initialHideChords = false, isPublic = false) => ({
        fav: initialFavorite === true || initialFavorite === 'true', fontSize: initialFontSize, columnCount: initialColumnCount,
        accidentals: initialAccidentals, transposeSteps: initialTranspose, hideChords: initialHideChords === true || initialHideChords === 'true', chordProRaw: '', renderedChordPro: '', menuVisible: false, fontMenu: false, transposeMenu: false, menuTimer: null,
        pinchStartDistance: 0, pinchStartFontSize: 16, swipeStartX: 0, swipeStartY: 0, swipeStartTime: 0,
        onTouchStart(e) { 
          if (e.touches.length === 2) { 
            this.pinchStartDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); 
            this.pinchStartFontSize = this.fontSize; 
          } else if (e.touches.length === 1) {
            this.swipeStartX = e.touches[0].clientX;
            this.swipeStartY = e.touches[0].clientY;
            this.swipeStartTime = Date.now();
          }
        },
        onTouchMove(e) { 
          if (e.touches.length === 2 && this.pinchStartDistance > 0) { 
            e.preventDefault(); 
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); 
            const ratio = dist / this.pinchStartDistance; 
            this.fontSize = Math.min(Math.max(Math.round((this.pinchStartFontSize * ratio) * 10) / 10, 8), 32); 
          } 
        },
        onTouchEnd(e) { 
          this.pinchStartDistance = 0; 
          if (e.changedTouches.length === 1 && this.swipeStartX !== 0) {
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - this.swipeStartX;
            const deltaY = touch.clientY - this.swipeStartY;
            const deltaTime = Date.now() - this.swipeStartTime;
            const absX = Math.abs(deltaX);
            const absY = Math.abs(deltaY);
            if (absX > 40 && absX > absY * 1.2 && deltaTime < 600) {
              if (deltaX < 0) { this.navigateToNext(); } else { this.navigateToPrevious(); }
            }
          }
          this.swipeStartX = 0;
          this.swipeStartY = 0;
        },
        navigateToNext() { const nextBtn = document.querySelector('a[title="Próxima música"]'); if (nextBtn) window.location.href = nextBtn.href; },
        navigateToPrevious() { const prevBtn = document.querySelector('a[title="Música anterior"]'); if (prevBtn) window.location.href = prevBtn.href; },
        init() { this.chordProRaw = this.normalizeNewlines(this.$refs.chordRaw ? this.$refs.chordRaw.textContent : ''); this.loadSettings(songId); this.render(); if (isPublic) { ['fontSize', 'columnCount', 'accidentals', 'transposeSteps', 'hideChords'].forEach((key) => this.$watch(key, () => this.saveLocalSettings())); } window.addEventListener('touchstart', (e) => this.onTouchStart(e), { passive: true }); window.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: false }); window.addEventListener('touchend', (e) => this.onTouchEnd(e)); },
        normalizeNewlines(value) { return String(value || '').replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\r/g, '\n'); },
        contentStyle() { const style = { fontSize: this.fontSize + 'px' }; if (this.columnCount) { style.columnCount = String(this.columnCount); style.columnGap = '2em'; style.columnFill = 'auto'; style.height = '100%'; style.overflowY = 'hidden'; style.overflowX = 'auto'; } return style; },
        render() { this.renderedChordPro = window.parseChordPro2 ? window.parseChordPro2(this.chordProRaw, this.transposeSteps, this.accidentals, this.hideChords) : ''; },
        settingsKey(songId) { return `praisechords:chord-settings:${songId}`; },
        applySettings(saved) { if (!saved) return; this.fontSize = typeof saved.fontSize === 'number' && saved.fontSize >= 8 && saved.fontSize <= 32 ? saved.fontSize : 16; this.columnCount = [0, 2, 3, 4].includes(saved.columnCount) ? saved.columnCount : 0; if (window.matchMedia('(max-width: 767px)').matches && this.columnCount > 3) this.columnCount = 3; this.accidentals = [-1, 0, 1].includes(saved.accidentals) ? saved.accidentals : 0; this.transposeSteps = Number.isInteger(saved.transpose) && saved.transpose >= -11 && saved.transpose <= 11 ? saved.transpose : 0; this.hideChords = saved.hideChords === true; this.render(); },
        async loadSettings(songId) { if (isPublic) { let cached = null; try { cached = JSON.parse(localStorage.getItem(this.settingsKey(songId)) || 'null'); } catch (error) { cached = null; } this.applySettings(cached); return; } try { const response = await fetch(`/api/chords/${songId}/settings`, { cache: 'no-store' }); if (response.ok) { const result = await response.json(); this.applySettings(result.data); localStorage.setItem(this.settingsKey(songId), JSON.stringify(result.data)); } else { const cached = JSON.parse(localStorage.getItem(this.settingsKey(songId)) || 'null'); this.applySettings(cached); } } catch (error) { const cached = JSON.parse(localStorage.getItem(this.settingsKey(songId)) || 'null'); this.applySettings(cached); } },
        confirmSave(songId) { if (isPublic) { this.saveSettings(songId); return; } if (window.confirm('Deseja gravar as alterações feitas nesta cifra?')) { this.saveSettings(songId); } },
        async saveSettings(songId) { const settings = { fontSize: this.fontSize, columnCount: this.columnCount, accidentals: this.accidentals, transpose: this.transposeSteps, hideChords: this.hideChords }; if (isPublic) { this.saveLocalSettings(); window.alert('Definições guardadas neste navegador.'); return; } try { const response = await fetch(`/api/chords/${songId}/settings`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) }); if (response.ok) { localStorage.setItem(this.settingsKey(songId), JSON.stringify(settings)); } } catch (error) { localStorage.setItem(this.settingsKey(songId), JSON.stringify(settings)); } },
        saveLocalSettings() { const settings = { fontSize: this.fontSize, columnCount: this.columnCount, accidentals: this.accidentals, transpose: this.transposeSteps, hideChords: this.hideChords }; try { localStorage.setItem(this.settingsKey(songId), JSON.stringify(settings)); } catch (error) {} },
        showMenu() { this.menuVisible = true; clearTimeout(this.menuTimer); this.menuTimer = setTimeout(() => { this.menuVisible = false; this.fontMenu = false; this.transposeMenu = false; }, 5000); },
        hideMenuSoon() { clearTimeout(this.menuTimer); this.menuTimer = setTimeout(() => { this.menuVisible = false; this.fontMenu = false; this.transposeMenu = false; }, 1000); },
        increaseFont() { this.fontSize = Math.min(Math.round((this.fontSize + 0.5) * 10) / 10, 32); },
        decreaseFont() { this.fontSize = Math.max(Math.round((this.fontSize - 0.5) * 10) / 10, 8); },
        cycleColumns() { const maxColumns = window.matchMedia('(max-width: 767px)').matches ? 3 : 4; this.columnCount = this.columnCount === 0 ? 2 : (this.columnCount >= maxColumns ? 0 : this.columnCount + 1); },
        setAccidentalMode(flats) { this.accidentals = flats ? -1 : 1; this.render(); },
        transpose(steps) { this.transposeSteps += steps; this.render(); },
        toggleHideChords() { this.hideChords = !this.hideChords; this.render(); },
        async toggleFavorite() { const previous = this.fav; this.fav = !this.fav; try { const response = await fetch(`/api/songs/${songId}/favorite`, { method: 'POST' }); this.fav = (await response.json()).favorite === true; } catch (error) { this.fav = previous; } },
        playYouTube() { const url = this.$refs.youtubeUrl ? this.$refs.youtubeUrl.textContent : ''; if (url && window.praiseChordsYoutube) window.praiseChordsYoutube.play(url); }
      }));
    });
  </script>
  <link rel="stylesheet" href="/static/chordpro.css?v=3">
  <script src="/static/chord-parser.js"></script>
  <script src="/static/alpine.min.js?v=3.14.9"></script>
  <div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black bg-opacity-70 p-2" style="overflow-y: auto;">
    <div id="modal-content" class="bg-gray-800 rounded-xl max-w-3xl w-full shadow-2xl border border-gray-700" style="max-height: calc(100vh - 2rem); overflow-y: auto;"></div>
  </div>
  <script>
    window.praiseChordsYoutube = {
      currentVideoId: '',
      isMobile() {
        return /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent || '');
      },
      extractVideoId(url) {
        let value = String(url || '').trim();
        if (!value) return '';
        if (/^[A-Za-z0-9_-]{11}$/.test(value)) return value;
        if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
        try {
          const parsed = new URL(value);
          let id = parsed.searchParams.get('v');
          if (!id && parsed.hostname === 'youtu.be') id = parsed.pathname.slice(1);
          if (!id && parsed.pathname.startsWith('/embed/')) id = parsed.pathname.split('/')[2];
          if (!id && parsed.pathname.startsWith('/shorts/')) id = parsed.pathname.split('/')[2];
          if (!id && parsed.pathname.startsWith('/live/')) id = parsed.pathname.split('/')[2];
          return /^[A-Za-z0-9_-]{11}$/.test(id || '') ? id : '';
        } catch (e) {
          return '';
        }
      },
      play(url) {
        let value = String(url || '').trim();
        if (!value) return;
        // Extrai o ID primeiro — na base de dados o campo pode guardar apenas o
        // ID puro (11 caracteres). Pré-adicionar "https://" antes de extrair
        // quebraria esse caso, tratando o ID como um domínio.
        // Constrói o link canónico do video (ou mantém o link original para
        // casos como playlists). Abre sempre diretamente no YouTube numa nova
        // aba, evitando os problemas de reprodução em iframe (ecrã preto, vídeos
        // com embedding desativado, etc.).
        const videoId = this.extractVideoId(value);
        if (videoId) {
          window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank', 'noopener,noreferrer');
          return;
        }
        // Sem ID válido (ex.: playlist): abre o link original normalizado.
        if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
        window.open(value, '_blank', 'noopener,noreferrer');
      },
      close() {}
    };

    document.body.addEventListener('htmx:beforeSwap', (event) => {
      const target = event.detail.target;
      const status = event.detail.xhr.status;
      if (target && target.id === 'login-messages' && status >= 400 && status < 500) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });

    function openModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      // When displaying the chord viewer, remove the dark overlay, padding,
      // and container constraints so chords use the maximum space
      // with no black border
      if (modal.querySelector('[x-data*="chordViewer"]')) {
        modal.classList.remove('bg-black', 'bg-opacity-70', 'p-2', 'p-4');
        modal.style.padding = '0';
        modal.style.overflowY = 'hidden';
        modal.style.alignItems = 'stretch';
        modal.style.justifyContent = 'flex-start';
      } else {
        modal.classList.add('bg-black', 'bg-opacity-70', 'p-2');
        modal.style.padding = '';
        modal.style.overflowY = 'auto';
        modal.style.alignItems = '';
        modal.style.justifyContent = '';
      }
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      // Reset modal styling for non-chord-viewer content
      modal.classList.add('bg-black', 'bg-opacity-70', 'p-2');
      modal.style.padding = '';
      modal.style.overflowY = 'auto';
      modal.style.alignItems = '';
      modal.style.justifyContent = '';
    }

    document.body.addEventListener('htmx:afterSwap', (event) => {
      try {
        const target = event.detail.target;
        if (target && target.id === 'modal') {
          // Processar elementos hx-* carregados dinamicamente no modal
          if (window.htmx) {
            window.htmx.process(target);
          }
          openModal();
        }
      } catch (e) {}
    });

    function refreshSetlists() {
      const target = document.getElementById('setlists-content');
      if (target) htmx.ajax('GET', '/htmx/setlists', { target: '#setlists-content', swap: 'innerHTML' });
    }

    document.body.addEventListener('song-added-to-setlist', () => {
      closeModal();
      refreshSetlists();
    });

    document.body.addEventListener('setlist-created', () => {
      closeModal();
      refreshSetlists();
    });

    document.body.addEventListener('song-updated', () => {
      closeModal();
    });

    document.body.addEventListener('song-created', () => {
      closeModal();
      const target = document.getElementById('songs-list');
      if (target && target.querySelector('li')) htmx.ajax('GET', '/htmx/songs', { target: '#songs-list', swap: 'innerHTML' });
    });

    document.body.addEventListener('htmx:afterRequest', (event) => {
      const path = event.detail.requestConfig && event.detail.requestConfig.path;
      const match = path && path.match(/^\/(?:api\/setlists\/(\d+)\/songs\/\d+\/remove|htmx\/setlists\/(\d+)\/songs\/\d+\/(?:up|down))$/);
      if (match && event.detail.successful) {
        htmx.ajax('GET', `/htmx/setlists/${match[1] || match[2]}`, { target: '#modal', swap: 'innerHTML' });
      }
    });

    document.body.addEventListener('click', (ev) => {
      const modal = document.getElementById('modal');
      if (!modal) return;
      if (ev.target === modal) closeModal();
      const close = ev.target.closest && ev.target.closest('[data-modal-close]');
      if (close) closeModal();
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
          .then((registration) => {
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
