<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="static/chordpro.css">
<style>
  body { margin:20px; font-family: monospace; background:#f0f0f0; }
  .box { background:#fff; padding:15px; margin:10px 0; border:1px solid #ccc; }
  .raw { background:#f8f8f8; padding:8px; font-size:11px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Teste: Sublime - Debug do Parser</h1>
<div class="box">
  <h3>ChordPro Original:</h3>
  <div class="raw" id="raw"></div>
</div>
<div class="box">
  <h3>HTML Gerado:</h3>
  <div id="output" class="chord-container"></div>
</div>
<div class="box">
  <h3>Estrutura HTML (texto):</h3>
  <pre id="structure"></pre>
</div>
<script src="static/chord-parser.js"></script>
<script>
  // ChordPro aproximado baseado no screenshot
  var cp = 
    "Qu[E]em é como Tu, Jesus\n" +
    "Não h[A]á [E]\n" +
    "Que é manso [C#m]e [B]\n" +
    "humilde assim\n" +
    "Não h[A]á [BE/G#]\n" +
    "á igual a Ti\n" +
    "Não h[C#m]á [B]\n" +
    "á";
  
  document.getElementById('raw').textContent = cp;
  var html = window.parseChordPro2(cp, 0, 0);
  document.getElementById('output').innerHTML = html;
  
  // Mostrar estrutura HTML de forma legível
  var structure = html
    .replace(/></g, '>\n<')
    .replace(/\s+/g, ' ')
    .trim();
  document.getElementById('structure').textContent = structure;
</script>
</body>
</html>
